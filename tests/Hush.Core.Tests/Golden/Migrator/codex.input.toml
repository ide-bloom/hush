# Codex configuration
model = "gpt-5-codex"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "{{GITHUB}}", GITHUB_HOST = "github.com" }

[mcp_servers.huggingface]
# Hugging Face hub tools
command = "uvx"
startup_timeout_sec = 20

[mcp_servers.huggingface.env]
HF_TOKEN = "{{HF}}"

[mcp_servers.docs]
command = "docs-mcp"
args = []
