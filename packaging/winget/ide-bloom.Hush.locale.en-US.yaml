ShortDescription: TPM- and Windows Hello-bound secrets for developers and AI agents.
Description: |-
  Hush keeps API keys and tokens in an encrypted vault that only unlocks on your PC (TPM) with you present
  (Windows Hello), and injects them into the one process that needs them: hush run -- npm run dev.
  It also finds plaintext secrets in .env files, MCP client configs and credential files, and migrates them.
